<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التاكسي الذكي - التطبيق الشامل</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-light: #ffffff;
            --text-gray: #aaaaaa;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--dark-bg );
            color: var(--text-light);
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at top, #1f1a0d 0%, var(--dark-bg) 40%);
            min-height: 100vh;
        }

        .container {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }
        .header h1 {
            color: var(--gold);
            font-size: 2.2em;
            margin: 0;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }
        .header p {
            color: var(--gold-light);
            margin: 5px 0;
            font-size: 1em;
        }
        .back-btn {
            position: absolute;
            right: 0;
            top: 10px;
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 1.5em;
            cursor: pointer;
            display: none;
        }

        /* Screens */
        .screen { display: none; animation: fadeIn 0.3s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Home Grid */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .service-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .service-card:hover {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            transform: translateY(-3px);
        }
        .service-card span { display: block; font-size: 2.5em; margin-bottom: 10px; }
        .service-card h3 { margin: 0; color: var(--gold-light); font-size: 1.1em; }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: var(--text-gray); font-size: 0.9em; margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-size: 1em;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--gold);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        /* Car Selection */
        .car-selection { display: flex; gap: 10px; margin-bottom: 20px; }
        .car-card {
            flex: 1; background-color: var(--card-bg); border: 1px solid #333;
            border-radius: 10px; padding: 15px 5px; text-align: center; cursor: pointer;
        }
        .car-card.active { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .car-card h3 { margin: 0; font-size: 0.9em; color: var(--gold-light); }

        /* Buttons */
        .submit-btn {
            width: 100%;
            background: linear-gradient(45deg, #b8860b, #ffd700, #b8860b);
            color: #000; border: none; padding: 15px; border-radius: 25px;
            font-family: 'Tajawal', sans-serif; font-size: 1.2em; font-weight: bold;
            cursor: pointer; margin-top: 10px;
        }
        .loc-btn {
            background: transparent; border: 1px solid var(--gold); color: var(--gold);
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-family: 'Tajawal';
            width: 100%; margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" id="backBtn" onclick="goHome()">❮</button>
            <h1>التاكسي الذكي</h1>
            <p id="headerDesc">اختر الخدمة التي تناسبك</p>
        </div>

        <!-- الشاشة الرئيسية: اختيار الخدمة -->
        <div id="homeScreen" class="screen active">
            <div class="services-grid">
                <div class="service-card" onclick="openService('trip_urgent', 'مشوار فوري')">
                    <span>🚕</span><h3>مشوار فوري</h3>
                </div>
                <div class="service-card" onclick="openService('trip_monthly', 'التزام شهري/أسبوعي')">
                    <span>📅</span><h3>التزام شهري</h3>
                </div>
                <div class="service-card" onclick="openService('srv_food', 'توصيل طلبات')">
                    <span>🍔</span><h3>توصيل طلبات</h3>
                </div>
                <div class="service-card" onclick="openService('srv_general', 'خدمات عامة')">
                    <span>🛠️</span><h3>خدمات عامة</h3>
                </div>
            </div>
        </div>

        <!-- شاشة تعبئة الطلب الشاملة -->
        <div id="formScreen" class="screen">
            <form id="mainForm">
                <input type="hidden" id="selectedServiceType">
                
                <button type="button" class="loc-btn" id="getLocationBtn" onclick="getLocation()">📍 تحديد موقعي الحالي تلقائياً</button>

                <div class="form-group">
                    <label>موقع الانطلاق / الاستلام:</label>
                    <input type="text" id="fromLocation" placeholder="اكتب الحي أو المعلم" required>
                    <input type="hidden" id="fromLat">
                    <input type="hidden" id="fromLon">
                </div>

                <div class="form-group" id="toLocationGroup">
                    <label>الوجهة:</label>
                    <input type="text" id="toLocation" placeholder="إلى أين؟">
                </div>

                <!-- قسم خاص بالمشاوير فقط -->
                <div id="carsGroup" class="car-selection">
                    <div class="car-card" onclick="selectCar('Standard', this)"><h3>Standard</h3></div>
                    <div class="car-card active" onclick="selectCar('VIP', this)"><h3>👑 VIP</h3></div>
                    <div class="car-card" onclick="selectCar('Van', this)"><h3>Van</h3></div>
                </div>
                <input type="hidden" id="carType" value="VIP">

                <div class="form-group">
                    <label>تفاصيل إضافية (اختياري):</label>
                    <textarea id="details" placeholder="مثال: عدد الركاب، تفاصيل الطلب، وقت محدد..."></textarea>
                </div>

                <button type="submit" class="submit-btn">❯ تأكيد وإرسال الطلب</button>
            </form>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // التنقل بين الشاشات
        function openService(serviceType, title) {
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('formScreen').classList.add('active');
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('headerDesc').textContent = title;
            document.getElementById('selectedServiceType').value = serviceType;

            // إخفاء/إظهار السيارات والوجهة حسب نوع الخدمة
            if(serviceType.startsWith('trip_')) {
                document.getElementById('carsGroup').style.display = 'flex';
                document.getElementById('toLocationGroup').style.display = 'block';
                document.getElementById('toLocation').required = true;
            } else {
                document.getElementById('carsGroup').style.display = 'none';
                document.getElementById('toLocationGroup').style.display = 'none';
                document.getElementById('toLocation').required = false;
            }
        }

        function goHome() {
            document.getElementById('formScreen').classList.remove('active');
            document.getElementById('homeScreen').classList.add('active');
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('headerDesc').textContent = 'اختر الخدمة التي تناسبك';
            document.getElementById('mainForm').reset();
        }

        // اختيار السيارة
        function selectCar(type, element) {
            document.getElementById('carType').value = type;
            document.querySelectorAll('.car-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
        }

        // تحديد الموقع
        function getLocation() {
            const btn = document.getElementById('getLocationBtn');
            btn.textContent = '⏳ جاري التحديد...';
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    document.getElementById('fromLat').value = position.coords.latitude;
                    document.getElementById('fromLon').value = position.coords.longitude;
                    document.getElementById('fromLocation').value = `موقعي الحالي (${position.coords.latitude.toFixed(4)}, ${position.coords.longitude.toFixed(4)})`;
                    btn.textContent = '✅ تم التحديد بنجاح';
                }, function(error) {
                    btn.textContent = '📍 تحديد موقعي الحالي تلقائياً';
                    tg.showPopup({title: 'خطأ', message: 'تعذر الحصول على موقعك. يرجى كتابته يدوياً.'});
                });
            }
        }

        // إرسال الطلب
        document.getElementById('mainForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const serviceType = document.getElementById('selectedServiceType').value;
            let finalDetails = document.getElementById('details').value;
            
            if(serviceType.startsWith('trip_')) {
                finalDetails = `نوع السيارة: ${document.getElementById('carType').value}\n` + finalDetails;
            }

            const data = {
                action: 'request_trip',
                trip_type: serviceType,
                from_location_text: document.getElementById('fromLocation').value,
                from_latitude: document.getElementById('fromLat').value || null,
                from_longitude: document.getElementById('fromLon').value || null,
                to_location_text: document.getElementById('toLocation').value || 'غير محدد',
                details: finalDetails
            };

            tg.showPopup({
                title: 'تأكيد الطلب',
                message: 'سيتم إرسال طلبك الآن للسائقين المتاحين.',
                buttons: [{type: 'ok'}]
            }, function() {
                tg.sendData(JSON.stringify(data));
                tg.close();
            });
        });
    </script>
</body>
</html>
